<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Scaffold reference: landing-option-2.webp</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@700&display=swap">
  <link rel="stylesheet" href="layout.css">
  <style>html,body{margin:0}body{background:#f6e8d9}.region{box-sizing:border-box}.region.text p{white-space:pre-wrap}</style>
</head>
<body>
<!-- Reference only. Every region sits at its measured box inside a comp-aspect frame. Take the boxes (layout.css), keep your own semantic structure. -->
<main class="comp-frame" style="max-width:940px">
  <div class="r-paper-texture region texture" data-region="paper-texture" style="background-image:url('../../../assets/plates/paper-texture.png');background-repeat:repeat"></div>
  <div class="r-brand region text" data-region="brand"><!-- SettleUp serif wordmark --><p style="font-size:var(--r-brand-font);line-height:1.05;margin:0">brand</p></div>
  <div class="r-sign-in region text" data-region="sign-in"><!-- Sign in navigation label --><p style="font-size:var(--r-sign-in-font);line-height:1.05;margin:0">sign-in</p></div>
  <div class="r-menu region control" data-region="menu"><!-- three horizontal graphite menu strokes: rebuild the control's chrome from the crop (comp-spec.mjs --crop menu); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-header-rule region chrome" data-region="header-rule"><!-- thin graphite divider below header --></div>
  <div class="r-headline region text" data-region="headline"><!-- large editorial serif headline We get each other next time --><p style="font-size:var(--r-headline-font);font-family:var(--r-headline-family),sans-serif;font-weight:var(--r-headline-weight);line-height:1.05;margin:0">headline</p></div>
  <div class="r-subhead region text" data-region="subhead"><!-- sans-serif sentence Start with what actually happened --><p style="line-height:1.05;margin:0">subhead</p></div>
  <div class="r-connect-bank region control" data-region="connect-bank"><!-- terracotta Connect a bank button with arrow: rebuild the control's chrome from the crop (comp-spec.mjs --crop connect-bank); its ink box, border, fill, radius, and label size are the comp's --></div>
  <figure class="r-upper-map-marks region plate" data-region="upper-map-marks"><img src="../../../assets/plates/upper-map-marks.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:top left"></figure>
  <figure class="r-jamie-story region plate" data-region="jamie-story"><img src="../../../assets/plates/jamie-story.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:top left"></figure>
  <div class="r-jamie-name region text" data-region="jamie-name"><!-- handwritten Jamie name on first blank slip --><p style="line-height:1.05;margin:0">jamie-name</p></div>
  <div class="r-jamie-purchase region text" data-region="jamie-purchase"><!-- Luna Pizza and 84.20 dollar purchase block on second slip --><p style="font-size:var(--r-jamie-purchase-font);line-height:1.05;margin:0">jamie-purchase</p></div>
  <figure class="r-noor-story region plate" data-region="noor-story"><img src="../../../assets/plates/noor-story.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:top left"></figure>
  <div class="r-noor-name region text" data-region="noor-name"><!-- handwritten Noor name on first blank slip --><p style="line-height:1.05;margin:0">noor-name</p></div>
  <div class="r-noor-purchase region text" data-region="noor-purchase"><!-- Drinks plus plates and 46.80 dollar purchase block on second slip --><p style="font-size:var(--r-noor-purchase-font);line-height:1.05;margin:0">noor-purchase</p></div>
  <figure class="r-eli-story region plate" data-region="eli-story"><img src="../../../assets/plates/eli-story.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:top left"></figure>
  <div class="r-eli-name region text" data-region="eli-name"><!-- handwritten Eli name on first blank slip --><p style="line-height:1.05;margin:0">eli-name</p></div>
  <div class="r-eli-purchase region text" data-region="eli-purchase"><!-- Gas plus utilities and 112.40 dollar purchase block on second slip --><p style="font-size:var(--r-eli-purchase-font);line-height:1.05;margin:0">eli-purchase</p></div>
  <figure class="r-route-convergence region plate" data-region="route-convergence"><img src="../../../assets/plates/route-convergence.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:top left"></figure>
  <figure class="r-group-marker region plate" data-region="group-marker"><img src="../../../assets/plates/group-marker.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:top left"></figure>
  <div class="r-group-copy region text" data-region="group-copy"><!-- The group evens out handwritten label below friend group marker --><p style="line-height:1.05;margin:0">group-copy</p></div>
  <figure class="r-trail-sign region plate" data-region="trail-sign"><img src="../../../assets/plates/trail-sign.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:top left"></figure>
  <div class="r-trail-copy region text" data-region="trail-copy"><!-- Follow the trail handwritten label on wooden sign --><p style="font-size:var(--r-trail-copy-font);line-height:1.05;margin:0">trail-copy</p></div>
</main>
</body>
</html>
