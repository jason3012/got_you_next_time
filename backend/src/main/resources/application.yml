spring:
  application:
    name: settleup-api
  profiles:
    default: local
  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB:settleup}
    username: ${POSTGRES_USER:settleup}
    password: ${POSTGRES_PASSWORD:localdevpassword}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

management:
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
  endpoints:
    web:
      exposure:
        include: health,info

security:
  jwt:
    issuer: settleup-api
    ttl: PT1H
    secret: ${JWT_SECRET}
  token-encryption-key: ${TOKEN_ENCRYPTION_KEY}

plaid:
  client-id: ${PLAID_CLIENT_ID:}
  secret: ${PLAID_SECRET:}
  environment: ${PLAID_ENV:sandbox}
  webhook-url: ${PLAID_WEBHOOK_URL:}

classification:
  confidence-floor: ${CLASSIFICATION_CONFIDENCE_FLOOR:0.45}

app:
  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
