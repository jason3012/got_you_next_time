name: Build and deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  publish-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/settleup-api:${{ github.sha }}
      - uses: azure/setup-kubectl@v4
      - name: Deploy image
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/settleup-api:${{ github.sha }}
        run: |
          if [ -z "$KUBE_CONFIG" ]; then
            echo "KUBE_CONFIG is not configured; image publication completed and deployment was skipped."
            exit 0
          fi
          mkdir -p "$HOME/.kube"
          printf '%s' "$KUBE_CONFIG" | base64 --decode > "$HOME/.kube/config"
          kubectl -n settleup set image deployment/api api="$IMAGE"
          kubectl -n settleup rollout status deployment/api --timeout=180s
